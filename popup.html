<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>GitHub PR Watcher</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__title">
        <span class="bar__logo" data-icon="pr"></span>
        <div class="tabs" role="tablist" aria-label="Разделы">
          <button class="tab" type="button" role="tab" id="tab-mine" data-tab="mine" aria-controls="list" aria-selected="true">
            <span class="tab__inner">Мои PR<span class="bar__count" id="count" title="Непрочитанное" hidden></span></span>
          </button>
          <button class="tab" type="button" role="tab" id="tab-review" data-tab="review" aria-controls="list" aria-selected="false" tabindex="-1">
            <span class="tab__inner">На ревью<span class="tab__n" id="review-count" title="Ждут вашего ревью" hidden></span></span>
          </button>
        </div>
      </div>
      <div class="bar__actions">
        <button class="icon-button" id="mark-all" title="Отметить всё прочитанным" hidden data-icon="checkAll"></button>
        <button class="icon-button" id="refresh" title="Проверить сейчас" data-icon="refresh"></button>
        <button class="icon-button" id="settings" title="Настройки" data-icon="settings"></button>
      </div>
    </header>
    <div class="status" id="status"></div>
    <div class="toolbar" id="toolbar" hidden></div>
    <main class="list" id="list" role="tabpanel"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
