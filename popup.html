<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>GitHub PR Watcher</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__title">
        <span class="bar__logo" data-icon="pr"></span>
        <span>Мои PR</span>
        <span class="bar__count" id="count" hidden></span>
      </div>
      <div class="bar__actions">
        <button class="icon-button" id="mark-all" title="Отметить всё прочитанным" hidden data-icon="checkAll"></button>
        <button class="icon-button" id="refresh" title="Проверить сейчас" data-icon="refresh"></button>
        <button class="icon-button" id="settings" title="Настройки" data-icon="settings"></button>
      </div>
    </header>
    <div class="status" id="status"></div>
    <main class="list" id="list"></main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
